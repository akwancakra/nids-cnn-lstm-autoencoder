    stage_name: stage0
    active: true
    condition: always
    profile: s4_hybrid_zero_shot_anomaly
    model_variant: hybrid
    stages: [preprocess, train, eval]
    tag: s4_00_repro_v4_full
    overrides:
      preprocess:
        scaler: quantile
        stride: 5
      threshold:
        percentile: 95
      evaluation:
        threshold_method: source_percentile
        score_mode: recon_mse

  - run_id: s4_01_strict_contract_full
