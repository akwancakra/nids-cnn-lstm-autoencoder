meta:
  sprint: CSE_F1_SPRINT4
  report_title: RESEARCH_REPORT_CSE_F1_SPRINT4
  base_config_hash: 14036f586d7ec1a72d21e76c827a310217e45f266f1646ea6291c3c3e17d30b5
  baseline_history:
    source: results/**/*_cse_metrics.json paired with *_cic_metrics.json
    cic_fpr_cap: 0.10
    best_recall_under_cic_fpr_cap: 0.34416488590844535
    recall_p50: 0.09882845351952903
    recall_p90: 0.19711520322725756
    best_recall_path: results/research/rs10_full_feature_filter_corr090/metrics/swp_rs10_full_feature_filter_corr090_percentile_p97p0_cse_metrics.json
  gate_rules:
    adaptive_recall:
      fixed_floor: 0.40
      plus_baseline: 0.05
      framing: conservative_sanity_target
    cse_precision_min: 0.30
    cic_fpr_max: 0.10
    collapse_flag:
      recall_gte: 0.95
      precision_lt: 0.20
  ranking_constraints:
    hard:
      cic_fpr_max: 0.10
      cse_precision_min: 0.30
    fallback:
      cic_fpr_max: 0.12
      cse_precision_min: 0.25
    sort_order:
      - cse_recall_desc
      - cse_f1_desc
      - cic_fpr_asc
  retry_policy:
    infra_retry_free_max: 2
  stage_validity_rules:
    stage1: 5
    stage2: 6
    stage3: 5
    stage4: 2
  promotion_timing: end_of_stage_only
  pivot_policy:
    on_gate_fail: USAD
    execute_in_same_sprint: false

profiles:
  s4_hybrid_zero_shot_anomaly:
    profile_path: config/sprint4/profiles/hybrid_zero_shot_anomaly.yaml

