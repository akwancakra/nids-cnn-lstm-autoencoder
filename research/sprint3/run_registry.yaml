meta:
  sprint: CSE_F1_SPRINT3
  report_title: RESEARCH_REPORT_CSE_F1_SPRINT3

profiles:
  s3_hybrid_zero_shot:
    profile_path: config/profiles/hybrid_zero_shot.yaml

runs:
  # Stage 0: Repro + hardening
  - run_id: s3_00_repro_best_known
    stage_name: stage0
    active: true
    profile: s3_hybrid_zero_shot
    model_variant: hybrid
    stages: [preprocess, train, eval]
    tag: s3_00_repro_best_known
    overrides:
      preprocess:
        scaler: robust
        feature_filter:
          enable_nzv: true
          enable_corr: true
          corr_threshold: 0.90
        scale_guard:
          enable: true
          raw_clip_quantile: 0.995
          post_scale_clip_abs: 20.0
      threshold:
        percentile: 97
      evaluation:
        mode: zero_shot
        threshold_method: source_percentile
        source_calib_split: calib
        score_mode: recon_mse
        sample_size: 200000

  - run_id: s3_01_strict_eval_full
    stage_name: stage0
    active: true
    profile: s3_hybrid_zero_shot
    model_variant: hybrid
    stages: [eval]
    tag: s3_01_strict_eval_full
    reuse_data_from: s3_00_repro_best_known
    reuse_model_from: s3_00_repro_best_known
    overrides:
      threshold:
        percentile: 97
      evaluation:
        mode: zero_shot
        threshold_method: source_percentile
        source_calib_split: calib
        score_mode: recon_mse
        sample_size: 0

