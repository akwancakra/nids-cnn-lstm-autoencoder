# Config for NIDS CNN-LSTM Autoencoder

paths:
  data_raw_cic: data/raw/CIC-IDS2017
  data_raw_cse: data/raw/CSE-CIC-IDS2018
  data_processed: data/processed
  models_dir: models
  results_dir: results

preprocess:
  drop_columns:
    - Flow ID
    - Timestamp
    - Src IP
    - Source IP
    - Dst IP
    - Destination IP
    - Src Port
    - Source Port
    - Dst Port
    - Destination Port
    - Protocol
  label_candidates:
    - Label
    - label
    - Class
    - class
  benign_label: BENIGN
  scaler: standard
  fillna_value: 0.0
  window_size: 10
  stride: 1
  test_size: 0.15
  val_size: 0.15
  random_seed: 42
  sample_frac: null
  max_rows_per_file: 300000
  chunksize: 50000
  split_by_file: true
  shard_enable: true
  shard_dir: data/processed/shards
  shard_size: 20000
  write_combined: false

training:
  force_cpu: false
  batch_size: 128
  epochs: 100
  learning_rate: 0.001
  early_stopping_patience: 10
  reduce_lr_patience: 5
  reduce_lr_factor: 0.5
  min_lr: 1.0e-6
  dropout: 0.2
  cnn_filters: [64, 128]
  cnn_kernel_size: 3
  lstm_units: [128, 64]
  latent_dim: 32

threshold:
  percentile: 99

evaluation:
  batch_size: 256
  sample_size: 200000
